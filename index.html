<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trinh thám TCX</title>
<meta name="theme-color" content="#fff3e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trinh thám">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
  :root{--kem:#fff8ee;--dao:#ffe1d2;--vang:#f2b544;--cam:#ff8a5c;--xanh:#1f2a55;--mo:#8a7a6a;--mint:#38c79a}
  html,body{margin:0;height:100%;background:var(--kem);color:var(--xanh);font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif}
  body{overflow:hidden}
  iframe{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#fbf9f4}
  .man{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;z-index:2;overflow:hidden;
    background:radial-gradient(120% 70% at 50% 0%,#fff 0%,var(--kem) 45%,var(--dao) 100%)}
  .man::before,.man::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;z-index:-1}
  .man::before{width:260px;height:260px;background:#ffd27a;top:-60px;right:-80px}
  .man::after{width:240px;height:240px;background:#ffc0d0;bottom:-70px;left:-80px}
  .be{position:relative;width:190px;height:190px;animation:nhun 2.8s ease-in-out infinite}
  .be img{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 7px #fff,0 18px 40px rgba(242,140,80,.35)}
  .be .quet{position:absolute;inset:-16px;border-radius:50%;border:2px dashed rgba(242,181,68,.6);animation:xoay 9s linear infinite}
  .be .lap{position:absolute;font-size:22px;animation:lap 2.4s ease-in-out infinite}
  .be .l1{top:-6px;left:-10px}.be .l2{top:22px;right:-22px;animation-delay:.8s}.be .l3{bottom:4px;left:-24px;animation-delay:1.6s}
  .bong{position:relative;background:#fff;border-radius:18px;padding:10px 16px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(31,42,85,.08);max-width:290px;text-wrap:balance}
  .bong::before{content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
  h1{margin:4px 0 0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:34px;line-height:1;letter-spacing:-.01em}
  h1 span{background:linear-gradient(90deg,var(--cam),var(--vang));-webkit-background-clip:text;background-clip:text;color:transparent}
  .phu{margin:0;text-wrap:balance;color:var(--mo);font-size:14px;max-width:300px;line-height:1.5}
  .cham{display:flex;gap:7px;margin-top:4px}
  .cham i{width:9px;height:9px;border-radius:50%;background:var(--cam);animation:nay 1s ease-in-out infinite}
  .cham i:nth-child(2){background:var(--vang);animation-delay:.15s}.cham i:nth-child(3){background:var(--mint);animation-delay:.3s}
  form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:310px;margin-top:6px}
  input{font:inherit;font-size:16px;padding:14px 16px;border-radius:999px;border:2px solid #f5dcc4;background:#fff;color:var(--xanh);text-align:center;outline:none;transition:border-color .2s}
  input:focus{border-color:var(--vang)}
  button{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:19px;padding:12px 16px;border-radius:999px;border:0;color:#fff;cursor:pointer;
    background:linear-gradient(90deg,var(--cam),var(--vang));box-shadow:0 10px 22px rgba(255,138,92,.35);transition:transform .15s}
  button:active{transform:scale(.97)}
  .loi{color:#e5484d;font-size:13px;min-height:18px}
  @keyframes nhun{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes xoay{to{transform:rotate(360deg)}}
  @keyframes lap{0%,100%{transform:scale(.6);opacity:.2}50%{transform:scale(1.1);opacity:1}}
  @keyframes nay{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="man" id="cho">
  <div class="be"><div class="quet"></div><img src="be.png" alt=""><span class="lap l1">✨</span><span class="lap l2">⭐</span><span class="lap l3">✨</span></div>
  <div class="bong" id="choTxt">Đợi em xíu, đang soi trend…</div>
  <div class="cham"><i></i><i></i><i></i></div>
</div>
<div class="man" id="nhapMa" hidden>
  <div class="be"><div class="quet"></div><img src="be.png" alt=""><span class="lap l1">✨</span><span class="lap l2">⭐</span><span class="lap l3">✨</span></div>
  <h1>Trinh thám <span>TCX</span></h1>
  <p class="phu">Trend nóng mỗi sáng, viết bài và làm ảnh đúng luật TCX, gọn trong một chạm.</p>
  <form id="f"><input id="ma" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Mã riêng của bạn" aria-label="Mã truy cập"><button type="submit">Vào làm việc 🚀</button><div class="loi" id="loi"></div></form>
</div>
<script>
  // Link web Trinh thám TCX (Apps Script). Mã truy cập KHÔNG ghi ở đây: mỗi máy tự nhập 1 lần.
  var WEB = 'https://script.google.com/macros/s/AKfycbywZs0I45T2OWCmhQdDbM3g5F3sP2KJBpJ9jftugQrky-YQnCWrZMLHXg2GJ9E_gLv1/exec';
  var TEN = ''; try { TEN = localStorage.getItem('tcx_ten') || ''; } catch (e) {}
  var GOI = TEN ? TEN.replace(/ (\S+)$/, '\u00a0$1') : 'cả\u00a0team';
  var CAU = ['Đợi em xíu, đang soi trend cho ' + GOI + '…','Đang lục tin nóng sáng nay 🔎','Đang mài bút viết content ✍️','Sắp xong rồi, pha cốc trà đi ạ ☕'];
  function doc(){ try { return localStorage.getItem('tcx_ma') || ''; } catch (e) { return ''; } }
  function ghi(v){ try { localStorage.setItem('tcx_ma', v); } catch (e) {} }
  var q = new URLSearchParams(location.search);
  if (q.has('doi-ma')) { ghi(''); try { localStorage.removeItem('tcx_ten'); } catch (e) {} }
  window.addEventListener('message', function(e){
    if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
    var d = e.data || {}; if (d.tcx === 'toi' && d.ten) { try { localStorage.setItem('tcx_ten', String(d.ten).slice(0, 40)); } catch (x) {} }
  });
  if (q.get('k')) { ghi(q.get('k')); history.replaceState(null, '', location.pathname); }
  function mo(ma){
    document.getElementById('choTxt').textContent = CAU[0];
    var cho = document.getElementById('cho'), txt = document.getElementById('choTxt'), i = 0;
    document.getElementById('nhapMa').hidden = true; cho.hidden = false;
    if (!navigator.onLine) { txt.textContent = 'Ơ, máy đang mất mạng rồi 😢 Có mạng lại thì mở lại app nhé!'; return; }
    var t = setInterval(function(){ i = (i + 1) % CAU.length; txt.textContent = CAU[i]; }, 1800);
    var f = document.createElement('iframe');
    f.src = WEB + '?k=' + encodeURIComponent(ma);
    f.title = 'Trinh thám TCX';
    f.allow = 'clipboard-read; clipboard-write; fullscreen';
    function an(){ clearInterval(t); cho.hidden = true; }
    f.onload = function(){ setTimeout(an, 500); };
    document.body.appendChild(f);
    setTimeout(an, 12000);
  }
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault(); var v = document.getElementById('ma').value.trim().replace(/^.*[?&]k=/, '');
    if (!v) { document.getElementById('loi').textContent = 'Chưa nhập mã kìa 😝'; return; }
    ghi(v); mo(v);
  });
  var ma = doc();
  if (ma) mo(ma); else { document.getElementById('cho').hidden = true; document.getElementById('nhapMa').hidden = false; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
