<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trinh thám TCX</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8ee;color:#1f2a55;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}a{color:#ff8a5c;font-weight:700}</style>
</head>
<body>
<p>Trinh thám TCX đã chuyển nhà 🏡<br>Đang mở bản mới… Nếu không tự mở, bấm <a id="lk" href="https://trinh-tham-tcx.pages.dev/">vào đây</a>.<br><small>Mở xong nhớ bấm “Thêm vào màn hình chính” lại nhé.</small></p>
<script>
  // App đã chuyển sang Cloudflare. Mang theo mã đã lưu trên máy để khỏi nhập lại.
  var MOI = 'https://trinh-tham-tcx.pages.dev/', ma = '';
  try { ma = localStorage.getItem('tcx_ma') || ''; } catch (e) {}
  var den = MOI + (ma ? '?k=' + encodeURIComponent(ma) : '');
  document.getElementById('lk').href = den;
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  setTimeout(function () { location.replace(den); }, 400);
</script>
</body>
</html>
